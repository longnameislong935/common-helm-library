# -- REQUIRES: Prometheus
serviceMonitor:
  enabled: false
  # -- Annotations for serviceMonitor
  annotations: {}
  # -- Labels for serviceMonitor
  labels: {}
  # -- Prometheus ServiceMonitor port
  port: 81
  # -- Prometheus ServiceMonitor interval
  interval: 30s
  # -- Prometheus ServiceMonitor scrapeTimeout. If empty, Prometheus uses the global scrape timeout unless it is less than the target's scrape interval value in which the latter is used.
  scrapeTimeout: ""
  # -- Prometheus ServiceMonitor path
  path: /metrics
  # -- Prometheus [RelabelConfigs] to apply to samples before scraping
  relabelings: []
  # -- Prometheus [MetricRelabelConfigs] to apply to samples before ingestion
  metricRelabelings: []
  # -- When true, honorLabels preserves the metric’s labels when they collide with the target’s labels.
  honorLabels: false
  # -- Prometheus ServiceMonitor scheme
  scheme: ""
  # -- Prometheus ServiceMonitor tlsConfig
  tlsConfig: {}

# -- REQUIRES: cnpg + barman cloud plugin
postgres:
  # -- Enable PostgreSQL Cluster (CloudNativePG)
  enabled: false
  # -- Number of instances (replicas)
  replicas: 1
  # -- Postgres image to use
  imageName: ""
  # -- Database name to create on init (defaults to Release Name)
  dbName: ""
  # -- Owner of the initial database (defaults to Release Name)
  owner: ""
  # -- Secret name containing app credentials for the database owner
  secretName: ""
  # -- Custom SQL to run after the cluster has been initialised.
  # This runs as the superuser against the `postgres` database.
  # Useful for creating extra databases or cluster-level roles.
  # @default -- []
  postInitSQL: []
    # - CREATE DATABASE "radarr-log" OWNER radarr
  # -- Custom SQL to run after init against the *application* database.
  # Use this to create extensions inside the app db (e.g. Immich's vchord).
  # @default -- []
  postInitApplicationSQL: []
    # - CREATE EXTENSION IF NOT EXISTS vchord CASCADE
    # - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE
  # -- Pass-through for the CNPG `.spec.postgresql` stanza. Set anything CNPG
  # supports here: shared_preload_libraries, parameters, pg_hba, etc.
  # Modules like vchord MUST be preloaded to work.
  # @default -- {}
  postgresql: {}
    # shared_preload_libraries:
    #   - vchord.so
    # parameters:
    #   max_connections: "200"
  # -- Pass-through for the CNPG `.spec.managed` stanza (declarative role mgmt).
  # e.g. grant the app role SUPERUSER so it can create untrusted extensions.
  # @default -- {}
  managed: {}
    # roles:
    #   - name: myapp
    #     ensure: present
    #     login: true
    #     superuser: true
    #     passwordSecret:
    #       name: myapp-cnpg-app
  # -- Enable superuser access
  enableSuperuser: true
  # -- Secret name for the superuser credentials
  superuserSecretName: ""
  # -- Storage Settings
  # -- Persistent Volume size for data
  size: "25Gi"
  # -- Storage class for data PVCs
  storageClassName: ""
  # -- Persistent Volume size for WALs
  walSize: "10Gi"
  # -- Storage class for WAL PVCs (defaults to storageClassName)
  walStorageClassName: ""
  # -- Resource requests and limits
  resources:
    requests:
      cpu: "50m"
      memory: "1Gi"
    limits:
      memory: "2Gi"
  skipEmptyWalArchiveCheck:
    # -- Allow restore from and backup to the same s3 bucket
    enabled: false
  # -- Recovery configuration
  recovery:
    # -- Enable recovery mode (requires existing S3 backup)
    enabled: false
    # -- Sync wave for the Cluster during recovery
    syncWave: "3"
    plugin:
      Name: "barman-cloud.cloudnative-pg.io"
    s3:
      # -- Path/Object name in the S3 bucket
      ObjectName: ""
  # -- Shared Backup settings
  backup:
    # -- Method used for backups (e.g. plugin)
    method: "plugin"
    pluginConfiguration:
      # -- Name of the Barman plugin
      name: "barman-cloud.cloudnative-pg.io"
  # -- Scheduled Backup configuration
  scheduledBackup:
    # -- Enable automated daily backups
    enabled: false
    # -- If not provided defaults to taking the length of the app name and uses it as the minute after 3am
    schedule: ""
    # -- Run a backup immediately if no backup exists on creation
    immediate: true
    # -- Optional: Override sync wave (defaults to 4 if recovery is enabled)
    syncWave: "4"


# -- MariaDB Cluster Configuration (MariaDB Operator)
mariadb:
  # -- Enable MariaDB Cluster
  enabled: false
  # -- Number of instances (replicas). 1 for standalone, 3 for Galera HA.
  replicas: 1
  # -- MariaDB image to use
  imageName: "mariadb:11.4"
  # -- Database name to create on initialisation
  dbName: ""
  
  # -- Password Management
  # -- Secret name to store the root password.
  # If the secret is empty or does not exist, the operator will 
  # automatically generate a random password and populate it.
  rootPasswordSecretName: ""

  # -- Monitoring
  metrics:
    # -- Enable Prometheus metrics exporter sidecar (Port 9104)
    enabled: true

  # -- Storage Settings
  # -- Persistent Volume size for data
  size: "25Gi"
  # -- Storage class for data PVCs. 
  # Note: pvcRetentionPolicy is set to 'Delete' to mimic CNPG cleanup.
  storageClassName: ""
  
  # -- Resource requests and limits
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

  # -- S3 Connection settings (Used for both Backup and Recovery)
  s3:
    # -- Secret containing the S3 credentials (keys below, default accessKeyId /
    # secretAccessKey). The operator reads them via SecretKeySelectors.
    secretName: ""
    # -- Key in the secret holding the access key id
    accessKeyIdKey: "accessKeyId"
    # -- Key in the secret holding the secret access key
    secretAccessKeyKey: "secretAccessKey"
    # -- S3 endpoint as a bare host:port — NO http:// scheme (e.g.
    # garage-s3.garage.svc.cluster.local:3900). Pair with tls:false for Garage.
    endpoint: ""
    # -- S3 bucket name
    bucket: ""
    # -- Optional folder/prefix within the bucket
    prefix: ""
    # -- S3 region (defaults to 'garage' for local S3)
    region: "garage"
    # -- Use TLS to reach the endpoint. false for plain-HTTP Garage.
    tls: false

  # -- Recovery configuration (restore into a BRAND-NEW instance only)
  recovery:
    # -- Enable recovery mode. If true, the operator will bootstrap
    # the database from the S3 bucket before starting.
    enabled: false
    # -- Guardrail Job. When recovery.enabled=true, it blocks the sync unless a
    # base backup exists (so a restore can't start against an empty bucket).
    # When recovery.enabled=false it now does NOTHING (a running DB's own
    # backups no longer trip it), so it's safe to leave on.
    checkExists: true
    # -- Restrict the guardrail's "does a backup exist?" check to this S3 prefix
    # (e.g. "physical" for PITR base backups). Empty = the whole bucket.
    checkPrefix: ""
    # -- Sync wave for the MariaDB resource during recovery
    syncWave: "10"
    # -- PITR only (pitr.enabled): RFC3339 time to recover to, e.g.
    # "2025-06-17T08:07:00Z". Omit to replay to the last recoverable point.
    targetRecoveryTime: ""
    # -- PITR only: staging PVC size for restore (defaults to the DB `size`)
    stagingSize: ""

  # -- Scheduled logical (mariadb-dump) Backup configuration
  backup:
    # -- Enable automated logical backups to S3
    enabled: false
    # -- Daily cron schedule (default 3 AM)
    schedule: "0 3 * * *"
    # -- Number of days to retain backups in S3
    retentionDays: 30
    # -- Optional: Override sync wave (defaults to 11)
    syncWave: "11"

  # -- Physical (mariadb-backup) base snapshots to S3. Required for PITR.
  # Requires operator >= v26.3.0.
  physicalBackup:
    enabled: false
    # -- Cron for base snapshots (binlogs cover the gaps, so this can be sparse)
    schedule: "0 */6 * * *"
    # -- Take a base backup immediately on creation
    immediate: true
    # -- Retention as a Duration (e.g. 720h = 30d)
    maxRetention: "720h"
    # -- Per-backup timeout
    timeout: "1h"
    # -- none | bzip2 | gzip
    compression: "gzip"
    # -- Replica | PreferReplica (PreferReplica falls back to primary if single-node)
    target: "PreferReplica"
    # -- S3 key prefix for base snapshots (keep distinct from pitr/backup)
    prefix: "physical"
    # -- Optional dedicated staging PVC size (defaults to node emptyDir if empty)
    stagingSize: ""
    stagingStorageClassName: ""
    syncWave: "11"

  # -- Point-in-time recovery: continuous binary-log archival to S3. Enabling
  # this links the MariaDB (pointInTimeRecoveryRef) so the operator turns on
  # binlogs + the archival sidecar. Requires physicalBackup.enabled.
  pitr:
    enabled: false
    # -- How often binlogs are flushed to S3 (~ the recovery-point gap)
    archiveTimeout: "5m"
    # -- none | bzip2 | gzip (immutable once set)
    compression: "gzip"
    # -- true = error if the exact target can't be met; false = replay to last recoverable
    strictMode: false
    # -- S3 key prefix for archived binlogs
    prefix: "binlog"
    syncWave: "11"

pxc:
  # -- Enable a Percona XtraDB Cluster (requires the pxc-operator to be running)
  enabled: false

  # -- CR schema version. Keep aligned with the running operator version.
  crVersion: "1.20.0"

  # -- Init image for the DB pods. Because the operator is deployed via this
  # library (container not named `percona-xtradb-cluster-operator`), its
  # auto-discovery fails, so the chart sets this explicitly. Defaults to
  # percona/percona-xtradb-cluster-operator:<crVersion>; override if you use a
  # different registry/tag for the operator image.
  initImage: ""

  # -- Cluster name. Defaults to "<release>-pxc".
  clusterName: ""
  # -- Sync wave for the cluster CR
  syncWave: "10"

  # -- Optional: name of the Secret holding system user passwords (operator
  # generates one if omitted)
  secretsName: ""

  # -- Rolling upgrade behaviour
  updateStrategy: "SmartUpdate"
  # -- apply: disabled | recommended | latest | <version>. `disabled` pins images.
  upgradeApply: "disabled"
  upgradeSchedule: "0 4 * * *"
  versionServiceEndpoint: "https://check.percona.com"

  tls:
    # -- Operator-managed TLS (uses cert-manager if present, else self-signed)
    enabled: true

  # -- Galera requires >=3 PXC nodes and >=2 proxy nodes. For single-node dev,
  # drop sizes AND set the matching flags here, e.g.:
  #   unsafeFlags: { pxcSize: true, proxySize: true, tls: false }
  unsafeFlags: {}

  # -- Database (Galera) nodes
  pxc:
    size: 3
    image: "percona/percona-xtradb-cluster:8.4.8-8.1"
    autoRecovery: true
    # -- Raw my.cnf ([mysqld] etc.) appended to the config
    configuration: ""
    storageClassName: ""
    storage: "8Gi"
    resources:
      requests:
        cpu: "600m"
        memory: "1Gi"
    # -- Spread replicas across nodes by this topology key
    antiAffinityTopologyKey: "kubernetes.io/hostname"
    # -- Optional advanced nodeAffinity (rendered under pxc.affinity.advanced)
    nodeAffinity: {}
    pdbMaxUnavailable: 1
    gracePeriod: 600

  # -- HAProxy proxy layer (default). Mutually exclusive with proxysql.
  haproxy:
    enabled: true
    size: 2
    image: "percona/haproxy:2.8.18-1"
    resources:
      requests:
        cpu: "600m"
        memory: "1Gi"
    antiAffinityTopologyKey: "kubernetes.io/hostname"
    pdbMaxUnavailable: 1
    gracePeriod: 30

  # -- ProxySQL proxy layer (alternative to HAProxy). Enable only one.
  proxysql:
    enabled: false
    size: 2
    image: "percona/proxysql2:2.7.3-1.3"
    storageClassName: ""
    storage: "2Gi"
    resources:
      requests:
        cpu: "600m"
        memory: "1Gi"
    antiAffinityTopologyKey: "kubernetes.io/hostname"

  # -- Fluent Bit log collector sidecar
  logcollector:
    enabled: true
    image: "percona/fluentbit:5.0.6-1"

  # -- Metrics. This chart exposes endpoints; scraping is done by your vmagent's
  # static promscrape config (see examples/pxc-vmagent-scrape.yaml). No PMM.
  metrics:
    # -- Adds a mysqld_exporter sidecar on the PXC pods (port 9104), matching the
    # way your mariadb-operator exposes 9104 for pod-SD discovery.
    mysqld:
      enabled: false
      image: "prom/mysqld-exporter:v0.15.1"
      port: 9104
      # -- Extra exporter flags, e.g. TLS: ["--tls.insecure-skip-verify"]
      extraArgs: []
      resources: {}
    # HAProxy already exposes Prometheus metrics on 8404, and the PITR pod on
    # 8080 — nothing to add here, just add scrape jobs for them (see the example).

  # -- PMM client agent (needs a running PMM server)
  pmm:
    enabled: false
    image: "percona/pmm-client:3.8.0"
    serverHost: "monitoring-service"

  # -- XtraBackup image used for backup/restore jobs
  backupImage: "percona/percona-xtrabackup:8.4.0-5.1"

  # -- S3 connection (Garage). Shared by full backups, binlog PITR, and restore.
  s3:
    # -- Secret with EXACTLY the keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    credentialsSecret: ""
    # -- Full endpoint URL WITH scheme (http:// for plain-HTTP Garage), e.g.
    # http://garage-s3.garage.svc.cluster.local:3900
    endpointUrl: ""
    # -- S3 bucket for backups
    bucket: ""
    # -- S3 region (arbitrary for Garage)
    region: "garage"
    # -- Path-style addressing — REQUIRED for Garage/MinIO
    forcePathStyle: true
    # -- Verify TLS on the endpoint. false for plain-HTTP Garage.
    verifyTLS: false
    # -- Preflight gate: a pre-sync Job (wave 2, before the cluster) that fails
    # the sync unless the bucket is reachable with these creds. Pauses cluster
    # creation on a misconfigured/unreachable Garage target.
    preflight: true
    preflightRetries: 3
    # -- Optionally let the chart create the credentials Secret (else bring your own).
    createSecret: false
    accessKeyId: ""
    secretAccessKey: ""
    # Low wave so a chart-created Secret exists before the guardrail (wave 2).
    syncWave: "1"

  # -- Scheduled full backups
  backup:
    enabled: false
    # -- Storage name registered under spec.backup.storages
    storageName: "s3-backup"
    # -- S3 key prefix for full backups (keep distinct from binlog prefix)
    prefix: "full"
    name: "daily-backup"
    schedule: "0 0 * * *"
    retentionCount: 5
    deleteFromStorage: true
    # -- Optional: provide a full list of schedule entries to override the single default
    schedules: []
    syncWave: "11"

  # -- Point-in-time recovery: continuous binlog upload to a DEDICATED storage.
  pitr:
    enabled: false
    storageName: "s3-binlog"
    # -- Bucket for binlogs (defaults to s3.bucket; prefix keeps them separate)
    bucket: ""
    prefix: "binlog"
    timeBetweenUploads: 60
    timeoutSeconds: 60

  # -- On-demand backup (creates a single PerconaXtraDBClusterBackup)
  onDemandBackup:
    enabled: false
    storageName: ""
    syncWave: "11"

  # -- Restore / recovery into this cluster
  recovery:
    enabled: false
    # -- Restore from an existing PerconaXtraDBClusterBackup object (by name).
    # If empty, restores directly from S3 using backupDestination below.
    backupName: ""
    # -- Backup folder name in the bucket -> destination s3://<bucket>/<backupDestination>
    backupDestination: ""
    syncWave: "10"
    # -- Guardrail Job: when recovery.enabled=true, blocks the sync unless backup
    # data exists in S3. When false it does nothing, so it's safe to leave on.
    checkExists: true
    checkPrefix: ""
    # -- Point-in-time recovery target
    pitr:
      enabled: false
      # -- latest | date | transaction
      type: "latest"
      # -- For type=date, RFC-ish "yyyy-mm-dd hh:mm:ss"
      date: ""
      # -- For type=transaction, a GTID
      gtid: ""

versionChecker:
  imageOverride: false

extraObjects: []
